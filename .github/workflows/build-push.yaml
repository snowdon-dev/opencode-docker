name: build & push opencode (Docker Hub)

on:
  workflow_dispatch:
    inputs:
      rust:
        description: 'Install the full Rust toolchain (INSTALL_RUST=true)'
        type: choice
        required: false
        default: 'true'
        options:
          - 'true'
          - 'false'
  push:
#    branches:
#      - main
    tags:
      - 'v*'
#    paths-ignore:
#      - 'README.md'
#      - 'Makefile'
#      - '.env'
#      - 'docker-compose*.yml'
#      - '.gitea/**'

# Serialize runs per branch/tag so `latest` is never pushed concurrently.
concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve Docker Hub image name
        id: image
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: echo "image=${DOCKERHUB_IMAGE:-devsnowdon/opencode-docker}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      # (a Docker Hub access token, not the account password).
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ steps.image.outputs.image }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:latest"
          else
            TAGS="${IMAGE}:latest,${IMAGE}:git-${GITHUB_SHA::7}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: opencode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            INSTALL_RUST=${{ inputs.rust || 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

