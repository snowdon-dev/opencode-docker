name: weekly opencode update & release

on:
  schedule:
    #- cron: '0 13 * * *'  # Every 24 hours
    - cron: '11 04 * * 0'
  workflow_dispatch:

concurrency:
  group: opencode-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve Docker Hub image name
        id: image
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: echo "image=${DOCKERHUB_IMAGE:-devsnowdon/opencode-docker}" >> "$GITHUB_OUTPUT"

      - name: Get previous image opencode version
        id: previous
        run: |
          IMAGE="${{ steps.image.outputs.image }}"

          if ! docker pull "$IMAGE:latest" >/dev/null 2>&1; then
            echo "No previous image found; assuming first build."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION="$(
            docker inspect "$IMAGE:latest" \
              --format '{{ index .Config.Labels "dev.snowdon.image.opencode.version" }}' \
              2>/dev/null || true
          )"
          case "$VERSION" in
            '' | '<no value>') VERSION="" ;;
          esac

          echo "OpenCode version: ${VERSION:-<none>}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest OpenCode release versions
        id: release
        env:
          PREVIOUS_IMAGE_VERSION: ${{ steps.previous.outputs.version }}
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.repos.listReleases({
              owner: 'anomalyco',
              repo: 'opencode',
              per_page: 2
            });

            const published = data.filter(r => !r.draft && !r.prerelease);
            if (published.length < 1) {
              core.setFailed('Could not find a published OpenCode release');
              return;
            }

            function parseVersion(version) {
              const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
              if (!match) {
                throw new Error(`Invalid semantic version: ${version}`);
              }
              return {
                major: Number(match[1]),
                minor: Number(match[2]),
                patch: Number(match[3]),
              };
            }

            const latest = published[0].tag_name.replace(/^v/, '');
            const latestVersion = parseVersion(latest);

            const imageVersion = process.env.PREVIOUS_IMAGE_VERSION || '';

            function isNewer(a, b) {
              return a.major > b.major ||
                (a.major === b.major && a.minor > b.minor) ||
                (a.major === b.major && a.minor === b.minor &&
                 a.patch > b.patch);
            }

            const updated = !imageVersion || isNewer(latestVersion, parseVersion(imageVersion));

            core.info(`Image OpenCode version: ${imageVersion || '<none>'}`);
            core.info(`Latest OpenCode:        ${latest}`);
            core.info(`Updated:                ${updated}`);

            core.setOutput('latest', latest);
            core.setOutput('major', latestVersion.major);
            core.setOutput('updated', String(updated));

      - name: Exit if opencode has not been updated
        run: |
          LATEST_VERSION=${{ steps.release.outputs.latest }}
          if [ "${{ steps.release.outputs.updated }}" = "false" ]; then
            echo "OpenCode has not been updated ($LATEST_VERSION); nothing to do."
            exit 0
          fi
          echo "OpenCode has been updated ($LATEST_VERSION)."

      - name: Failed if something might break
        run: |
          MAJOR=${{ steps.release.outputs.major }}
          if [ "$MAJOR" != "1" ]; then
            exit 1
          fi

      - name: Install svu
        run: |
          go install github.com/caarlos0/svu@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      # Computed once, then reused: create and push the next patch tag, and
      # dispatch build-push.yaml on that exact tag. Pushes made with the
      # default GITHUB_TOKEN do not emit workflow events, so the explicit
      # dispatch below is required.
      - name: Tag patch
        id: tag
        run: |
          TAG="$(svu patch)"
          echo "Creating and pushing tag $TAG"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger build & push
        run: |
          echo "Dispatching 'build & push opencode (Docker Hub)' for ${{ steps.tag.outputs.tag }}"
          gh workflow run build-push.yaml --ref "${{ steps.tag.outputs.tag }}"
