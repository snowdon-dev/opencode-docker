services:
    opencode:
        environment:
            # Basic auth for the backend. Empty (the default) leaves the backend
            # open inside the compose network; the launcher probes the health
            # endpoint, which stays reachable either way.
            OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-password}"
    tui:
        environment:
            # The client authenticates against the backend with the same password.
            OPENCODE_PASSWORD: "${OPENCODE_SERVER_PASSWORD:-password}"
