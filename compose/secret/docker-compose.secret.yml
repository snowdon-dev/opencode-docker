# The api key the backend runs with, handed over as a file secret instead of an
# environment variable: compose mounts the key file into the container at
# /run/secrets/api_key, where opencode reads it through the
# `{file:/run/secrets/api_key}` reference in the project's opencode.json (see
# the "API key secret" section of the README). The value therefore never
# appears in `docker inspect`, in the compose config, or in any host-side
# environment - only the path of the file does.
#
# The launcher merges this file only after it read a non-empty key from
# $OPENCODE_KEY_FILE (~/.config/opencode-docker/opencode.key by default) and
# exported that path, so `file:` below resolves to the host key file itself.
# The literal fallback is the repository's own secrets/ directory (relative to
# the compose project directory, i.e. the repository root) for using this file
# without the launcher; it is gitignored, like every key file should be.
secrets:
    api_key:
        file: ${OPENCODE_KEY_FILE:-./secrets/api_key}
services:
    opencode:
        secrets:
            - api_key
